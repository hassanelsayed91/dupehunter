[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dupehunter"
version = "1.0.0"
description = "Find files with identical content on Windows and clean them up safely - verify, quarantine, undo."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hassan Elsayed", email = "acc.hassan.2012@gmail.com" }]
keywords = ["windows", "duplicates", "dedupe", "disk-space", "cli", "tkinter", "productivity"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment :: File Managers",
  "Topic :: System :: Filesystems",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/hassanelsayed91/dupehunter"
Issues = "https://github.com/hassanelsayed91/dupehunter/issues"
Changelog = "https://github.com/hassanelsayed91/dupehunter/blob/main/CHANGELOG.md"

[project.scripts]
dupehunter = "dupehunter.cli:main"

[tool.setuptools]
packages = ["dupehunter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
